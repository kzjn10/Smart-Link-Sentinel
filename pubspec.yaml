name: ai_deeplink_tester
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  meta: ^1.17.0
  intl:

  cupertino_icons: ^1.0.8

  # DI
  injectable: ^2.5.1
  get_it: ^9.2.1
  json_annotation: ^4.11.0
  freezed_annotation: ^3.1.0

  # Bloc
  flutter_bloc: ^9.1.0

  # Router
  go_router: ^17.1.0

  # Database
  drift: ^2.32.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # UUID
  uuid: ^4.4.2

  # Adaptive Theme
  adaptive_theme: ^3.7.2
  bloc_concurrency: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  injectable_generator: ^2.12.0
  json_serializable: ^6.13.0
  build_runner: ^2.12.2
  drift_dev: ^2.32.0
  flutter_gen_runner: ^5.13.0
  freezed: ^3.2.5
  go_router_builder: ^4.2.0

dependency_overrides:
  analyzer: ^10.0.0

flutter_gen:
  output: lib/gen/
  line_length: 80

  assets:
    enabled: true
    outputs:
      class_name: AiDeeplinkAssets
      package_parameter_enabled: false
      style: dot-delimiter

  fonts:
    enabled: true
    outputs:
      class_name: AiDeeplinkFont

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/

  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.otf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.otf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.otf
          weight: 700
        - asset: assets/fonts/GoogleSans-Italic.otf
          style: italic

